<div class="client-form-container">
  <h2>{{ isEdit ? 'Edit Client' : 'Add Client' }}</h2>

  <mat-progress-spinner *ngIf="isLoading" mode="indeterminate"></mat-progress-spinner>
  <div *ngIf="error" class="error">{{ error }}</div>

  <form [formGroup]="clientForm" (ngSubmit)="onSubmit()" *ngIf="!isLoading">
    <mat-form-field class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="nom" required />
      <mat-error *ngIf="clientForm.get('name')?.hasError('required')">
        Name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" required />
      <mat-error *ngIf="clientForm.get('email')?.hasError('required')">
        Email is required
      </mat-error>
      <mat-error *ngIf="clientForm.get('email')?.hasError('email')">
        Please enter a valid email
      </mat-error>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Phone</mat-label>
      <input matInput formControlName="phone" />
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Address</mat-label>
      <textarea matInput formControlName="address"></textarea>
    </mat-form-field>

    <div class="button-container">
      <button mat-stroked-button color="primary" type="button" (click)="cancel()">Cancel</button>
      <button mat-raised-button color="accent" type="submit" [disabled]="clientForm.invalid || isLoading">
        {{ isEdit ? 'Update' : 'Create' }}
      </button>
    </div>
  </form>
</div>
