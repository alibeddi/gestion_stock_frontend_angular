<div class="client-detail-container">
  <button mat-button color="primary" (click)="goBack()">
    <mat-icon>arrow_back</mat-icon> Back to Clients
  </button>

  <mat-progress-spinner *ngIf="isLoading" mode="indeterminate"></mat-progress-spinner>
  <div *ngIf="error" class="error">{{ error }}</div>

  <mat-card *ngIf="!isLoading && !error && client">
    <mat-card-title>{{ client.nom }}</mat-card-title>
    <mat-card-subtitle>ID: {{ client.id }}</mat-card-subtitle>
    <mat-card-content>
      <p><strong>Email:</strong> {{ client.email }}</p>
      <p><strong>Phone:</strong> {{ client.telephone }}</p>
      <p><strong>Address:</strong> {{ client.adresseRue }}</p>
      <!-- Add more fields as needed -->
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" [routerLink]="['/clients/client-form', client.id]">Edit</button>
    </mat-card-actions>
  </mat-card>
</div>
