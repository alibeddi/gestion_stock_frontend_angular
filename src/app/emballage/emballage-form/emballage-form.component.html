<div class="container">
  <div class="header">
    <h1>{{ pageTitle }}</h1>
    <button mat-raised-button color="primary" (click)="navigateToList()">
      <mat-icon>arrow_back</mat-icon>
      Retour à la liste
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <form [formGroup]="emballageForm" (ngSubmit)="onSubmit()">
        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>Code</mat-label>
            <input
              matInput
              formControlName="code"
              placeholder="Ex: EMB001"
              required
            />
            <mat-error *ngIf="emballageForm.get('code')?.hasError('required')">
              Le code est obligatoire
            </mat-error>
            <mat-error *ngIf="emballageForm.get('code')?.hasError('maxlength')">
              Le code ne doit pas dépasser 50 caractères
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Libellé</mat-label>
            <input
              matInput
              formControlName="libelle"
              placeholder="Ex: Carton standard"
              required
            />
            <mat-error
              *ngIf="emballageForm.get('libelle')?.hasError('required')"
            >
              Le libellé est obligatoire
            </mat-error>
            <mat-error
              *ngIf="emballageForm.get('libelle')?.hasError('maxlength')"
            >
              Le libellé ne doit pas dépasser 100 caractères
            </mat-error>
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>Poids (kg)</mat-label>
            <input
              matInput
              type="number"
              step="0.01"
              formControlName="poids"
              placeholder="Ex: 0.5"
            />
            <mat-error *ngIf="emballageForm.get('poids')?.hasError('min')">
              Le poids doit être supérieur ou égal à 0
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Type d'emballage</mat-label>
            <mat-select formControlName="typeEmballage">
              <mat-option>Aucun</mat-option>
              <mat-option
                *ngFor="let type of typeEmballageOptions"
                [value]="type"
              >
                {{ type }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div class="form-actions">
          <button mat-button type="button" (click)="resetForm()">
            Réinitialiser
          </button>
          <button
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="emballageForm.invalid || isLoading"
          >
            <mat-icon>save</mat-icon>
            {{ isEditMode ? "Mettre à jour" : "Enregistrer" }}
          </button>
        </div>
      </form>

      <div class="loading-shade" *ngIf="isLoading">
        <mat-spinner diameter="50"></mat-spinner>
      </div>
    </mat-card-content>
  </mat-card>
</div>
