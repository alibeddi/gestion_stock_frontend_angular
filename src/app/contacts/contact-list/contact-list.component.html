<div class="container">
  <div class="header">
    <h1>Contacts</h1>
    <button mat-raised-button color="primary" (click)="addContact()">
      <mat-icon>add</mat-icon> Ajouter un contact
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <div class="search-container">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Rechercher</mat-label>
          <input
            matInput
            (keyup)="applyFilter($event)"
            placeholder="Nom, email, société..."
          />
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
      </div>

      <div class="table-container">
        <div class="loading-shade" *ngIf="isLoading">
          <mat-spinner></mat-spinner>
        </div>

        <table mat-table [dataSource]="dataSource" class="full-width-table">
          <!-- Nom Column -->
          <ng-container matColumnDef="nom">
            <th mat-header-cell *matHeaderCellDef>Nom</th>
            <td mat-cell *matCellDef="let contact">
              {{ contact.prenom }} {{ contact.nom }}
            </td>
          </ng-container>

          <!-- Email Column -->
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let contact">{{ contact.email }}</td>
          </ng-container>

          <!-- Telephone Column -->
          <ng-container matColumnDef="telephone">
            <th mat-header-cell *matHeaderCellDef>Téléphone</th>
            <td mat-cell *matCellDef="let contact">
              {{ contact.mobile || contact.telephone || "-" }}
            </td>
          </ng-container>

          <!-- Société Column -->
          <ng-container matColumnDef="nomSociete">
            <th mat-header-cell *matHeaderCellDef>Société</th>
            <td mat-cell *matCellDef="let contact">
              {{ contact.nomSociete || "-" }}
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let contact">
              <button mat-icon-button (click)="viewContact(contact.id)">
                <mat-icon>visibility</mat-icon>
              </button>
              <button mat-icon-button (click)="editContact(contact.id)">
                <mat-icon>edit</mat-icon>
              </button>
              <button
                mat-icon-button
                color="warn"
                (click)="deleteContact(contact.id)"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

          <!-- Row shown when there is no matching data -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="5">Aucun contact trouvé</td>
          </tr>
        </table>

        <mat-paginator
          [length]="totalItems"
          [pageSize]="pageSize"
          [pageSizeOptions]="[5, 10, 25, 50]"
          (page)="onPageChange($event)"
          showFirstLastButtons
        ></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
