<!-- <div class="user-list-container"> -->
<div class="users-container">
  <div class="header-row">
    <h2>Gestion des Utilisateurs</h2>
    <div class="actions">
      <button
        mat-raised-button
        color="primary"
        routerLink="/settings/users/new"
      >
        <mat-icon>add</mat-icon>
        Ajouter un utilisateur
      </button>

      <button
        mat-raised-button
        color="accent"
        (click)="loadUsers()"
        [disabled]="isLoading"
      >
        <mat-icon>refresh</mat-icon>
        Actualiser
      </button>

      <button mat-raised-button color="basic" (click)="loadMockUsers()">
        <mat-icon>dataset</mat-icon>
        Données de test
      </button>
    </div>
  </div>

  <!-- Error Alert -->
  <div *ngIf="error" class="error-alert">
    <mat-icon color="warn">error</mat-icon>
    <span>{{ error }}</span>
    <button mat-icon-button (click)="error = null">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-card class="filter-card">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Rechercher</mat-label>
      <input
        matInput
        placeholder="Nom, prénom ou email..."
        [(ngModel)]="searchTerm"
        (ngModelChange)="applyFilter()"
      />
      <button
        *ngIf="searchTerm"
        matSuffix
        mat-icon-button
        aria-label="Clear"
        (click)="clearSearch()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </mat-card>

  <div *ngIf="isLoading" class="loading-container">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="!isLoading && users.length === 0" class="no-data">
    <mat-icon class="no-data-icon">people_outline</mat-icon>
    <p>Aucun utilisateur trouvé</p>
  </div>

  <div *ngIf="!isLoading && users.length > 0" class="users-list">
    <mat-card *ngFor="let user of filteredUsers" class="user-card">
      <div class="user-info">
        <div
          class="user-avatar"
          [style.background-color]="getAvatarColor(user)"
        >
          {{ getInitials(user) }}
        </div>
        <div class="user-details">
          <h3>{{ user.prenom }} {{ user.nom }}</h3>
          <p class="email">{{ user.email }}</p>
          <p class="role">{{ user.role || "Aucun rôle" }}</p>
        </div>
      </div>
      <div class="user-actions">
        <button
          mat-icon-button
          color="primary"
          [routerLink]="['/settings/users', user.id]"
          matTooltip="Voir détails"
        >
          <mat-icon>visibility</mat-icon>
        </button>
        <button
          mat-icon-button
          color="accent"
          [routerLink]="['/settings/users/edit', user.id]"
          matTooltip="Modifier"
        >
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          color="warn"
          (click)="confirmDelete(user)"
          matTooltip="Supprimer"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </mat-card>
  </div>
</div>
