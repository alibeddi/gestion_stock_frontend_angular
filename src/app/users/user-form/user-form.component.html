<div class="user-form-container">
  <h2>{{ isEdit ? 'Edit User' : 'Add User' }}</h2>

  <mat-progress-spinner *ngIf="isLoading" mode="indeterminate"></mat-progress-spinner>
  <div *ngIf="error" class="error">{{ error }}</div>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" *ngIf="!isLoading">
    <mat-form-field class="full-width">
      <mat-label>Username</mat-label>
      <input matInput formControlName="username" required />
      <mat-error *ngIf="userForm.get('username')?.hasError('required')">
        Username is required
      </mat-error>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" required />
      <mat-error *ngIf="userForm.get('email')?.hasError('required')">
        Email is required
      </mat-error>
      <mat-error *ngIf="userForm.get('email')?.hasError('email')">
        Please enter a valid email
      </mat-error>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Role</mat-label>
      <input matInput formControlName="role" required />
      <mat-error *ngIf="userForm.get('role')?.hasError('required')">
        Role is required
      </mat-error>
    </mat-form-field>

    <div class="button-container">
      <button mat-stroked-button color="primary" type="button" (click)="cancel()">Cancel</button>
      <button mat-raised-button color="accent" type="submit" [disabled]="userForm.invalid || isLoading">
        {{ isEdit ? 'Update' : 'Create' }}
      </button>
    </div>
  </form>
</div>
