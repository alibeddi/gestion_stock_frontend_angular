<h2 mat-dialog-title>
  Manage Permissions for {{ data.user.prenom }} {{ data.user.nom }}
</h2>

<mat-dialog-content>
  <div class="loading-overlay" *ngIf="isLoading">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <div class="permissions-container">
    <div class="categories-list">
      <div *ngFor="let category of data.categories" class="category-section">
        <mat-card class="category-card">
          <mat-card-header>
            <mat-checkbox
              [checked]="isCategorySelected(category)"
              [indeterminate]="isCategoryIndeterminate(category)"
              (change)="toggleCategory(category)"
            >
              {{ category }}
            </mat-checkbox>
          </mat-card-header>

          <mat-card-content>
            <div class="permissions-list">
              <mat-checkbox
                *ngFor="let permission of data.permissionsByCategory[category]"
                [checked]="isPermissionSelected(permission)"
                (change)="togglePermission(permission)"
              >
                <div class="permission-item">
                  <div class="permission-name">{{ permission.name }}</div>
                  <div
                    class="permission-description"
                    *ngIf="permission.description"
                  >
                    {{ permission.description }}
                  </div>
                </div>
              </mat-checkbox>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [disabled]="isLoading">Cancel</button>
  <button
    mat-raised-button
    color="primary"
    (click)="savePermissions()"
    [disabled]="isLoading"
  >
    <mat-icon>save</mat-icon> Save
  </button>
</mat-dialog-actions>
