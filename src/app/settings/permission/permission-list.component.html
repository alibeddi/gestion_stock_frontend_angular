<div class="container">
  <div class="header">
    <h2>Permissions Management</h2>
    <div class="actions">
      <button
        mat-raised-button
        color="primary"
        (click)="openPermissionDialog()"
      >
        <mat-icon>add</mat-icon> Add Permission
      </button>
      <button
        mat-raised-button
        color="accent"
        (click)="initializeDefaultPermissions()"
      >
        <mat-icon>restart_alt</mat-icon> Initialize Default Permissions
      </button>
    </div>
  </div>

  <mat-card class="filter-card">
    <mat-card-content>
      <div class="filter-container">
        <mat-form-field appearance="outline">
          <mat-label>Filter</mat-label>
          <input
            matInput
            (keyup)="applyFilter($event)"
            placeholder="Search by name or description"
          />
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>

        <div class="category-filter">
          <span>Filter by Category:</span>
          <div class="chip-list">
            <button
              mat-flat-button
              [color]="selectedCategory === '' ? 'primary' : ''"
              (click)="filterByCategory('')"
            >
              All
            </button>
            <button
              mat-flat-button
              *ngFor="let category of categories"
              [color]="selectedCategory === category ? 'primary' : ''"
              (click)="filterByCategory(category)"
            >
              {{ category }}
            </button>
          </div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <div class="loading-container" *ngIf="isLoading">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <div class="error-container" *ngIf="error">
    <mat-error>{{ error }}</mat-error>
  </div>

  <div class="table-container" *ngIf="!isLoading && !error">
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let permission">{{ permission.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let permission">{{ permission.name }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
        <td mat-cell *matCellDef="let permission">
          {{ permission.description || "-" }}
        </td>
      </ng-container>

      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Category</th>
        <td mat-cell *matCellDef="let permission">
          <span class="category-badge">{{
            permission.category || "Uncategorized"
          }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let permission">
          <button
            mat-icon-button
            color="primary"
            (click)="openPermissionDialog(permission)"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            color="warn"
            (click)="deletePermission(permission)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="5">No permissions found</td>
      </tr>
    </table>

    <mat-paginator
      [pageSizeOptions]="[10, 25, 50, 100]"
      showFirstLastButtons
    ></mat-paginator>
  </div>
</div>
