<div class="sidebar-container">
  <div class="logo-container">
    <img
      src="assets/images/agil_tunisie_logo.png"
      alt="Company Logo"
      class="logo"
    />
  </div>

  <mat-nav-list class="nav-list">
    <ng-container *ngFor="let item of navItems">
      <!-- Special case for Settings which should only be visible to admins -->
      <ng-container *ngIf="item.name === 'Paramètres'">
        <a
          *ngIf="isAdmin()"
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active-link"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.name }}</span>
        </a>
      </ng-container>

      <!-- Regular menu items visible to all users -->
      <ng-container *ngIf="item.name !== 'Paramètres'">
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active-link"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.name }}</span>
        </a>
      </ng-container>
    </ng-container>
  </mat-nav-list>

  <div class="sidebar-footer">
    <p>CRM Agil Energy</p>
    <p>v{{ appVersion }} &copy; {{ currentYear }}</p>
  </div>
</div>
