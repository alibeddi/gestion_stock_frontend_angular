<div class="sidebar-container">
  <div class="logo-container">
    <img
      src="assets/images/agil_tunisie_logo.png"
      alt="Company Logo"
      class="logo"
    />
  </div>

  <mat-nav-list class="sidebar-nav">
    <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
      <mat-icon>dashboard</mat-icon>
      <span>Dashboard</span>
    </a>

    <a
      mat-list-item
      routerLink="/clients"
      routerLinkActive="active"
      *ngIf="canAccessFeature('clients.view')"
    >
      <mat-icon>business</mat-icon>
      <span>Clients</span>
    </a>

    <a
      mat-list-item
      routerLink="/prospects"
      routerLinkActive="active"
      *ngIf="canAccessFeature('prospects.view')"
    >
      <mat-icon>person_add</mat-icon>
      <span>Prospects</span>
    </a>

    <a
      mat-list-item
      routerLink="/contacts"
      routerLinkActive="active"
      *ngIf="canAccessFeature('clients.view')"
    >
      <mat-icon>contacts</mat-icon>
      <span>Contacts</span>
    </a>

    <a
      mat-list-item
      routerLink="/devis"
      routerLinkActive="active"
      *ngIf="canAccessFeature('quotes.view')"
    >
      <mat-icon>request_quote</mat-icon>
      <span>Devis</span>
    </a>

    <a
      mat-list-item
      routerLink="/emballages"
      routerLinkActive="active"
      *ngIf="canAccessFeature('products.view')"
    >
      <mat-icon>inventory_2</mat-icon>
      <span>Emballages</span>
    </a>

    <a
      mat-list-item
      routerLink="/products"
      routerLinkActive="active"
      *ngIf="canAccessFeature('products.view')"
    >
      <mat-icon>inventory</mat-icon>
      <span>Produits</span>
    </a>


    <a
      mat-list-item
      routerLink="/settings"
      routerLinkActive="active"
      *ngIf="isAdmin()"
    >
      <mat-icon>settings</mat-icon>
      <span>Paramètres</span>
    </a>
  </mat-nav-list>

  <div class="sidebar-footer">
    <p>CRM Agil Energy</p>
    <p>v{{ appVersion }} &copy; {{ currentYear }}</p>
  </div>
</div>
